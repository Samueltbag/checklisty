<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheckListy - Seu conteúdo, em ordem</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="icon" type="image/jpeg" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans pb-10">

  <!-- Header Fixo -->
  <header class="p-4 bg-zinc-900 border-b border-zinc-800 sticky top-0 z-10 shadow-lg space-y-3">
    <div class="flex justify-between items-center max-w-md mx-auto">
      <div class="flex items-center gap-2.5 cursor-pointer" id="btn-home">
        <img src="icon.png" alt="Logo CheckListy" class="w-8 h-8 rounded-lg border border-zinc-700/60 object-cover shadow">
        <div class="flex flex-col">
          <h1 class="text-lg font-bold text-white tracking-tight leading-tight">Check<span class="text-emerald-500">Listy</span></h1>
          <span class="text-[10px] text-zinc-400 font-normal">Seu conteúdo, em ordem.</span>
        </div>
      </div>
      <button id="btn-add-modal" class="px-3 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-semibold flex items-center gap-1 shadow">
        <span>+</span> Playlist
      </button>
    </div>

    <!-- Filtros de Status (Visíveis apenas dentro de uma playlist) -->
    <div id="filter-bar" class="hidden grid-cols-4 gap-1 text-[11px] sm:text-xs max-w-md mx-auto">
      <button data-filter="all" class="filter-btn py-1.5 rounded-lg bg-emerald-600 text-white font-medium text-center">Todos</button>
      <button data-filter="watching" class="filter-btn py-1.5 rounded-lg bg-zinc-800 text-zinc-400 font-medium text-center">Assistindo</button>
      <button data-filter="unstarted" class="filter-btn py-1.5 rounded-lg bg-zinc-800 text-zinc-400 font-medium text-center">Não Iniciados</button>
      <button data-filter="completed" class="filter-btn py-1.5 rounded-lg bg-zinc-800 text-zinc-400 font-medium text-center">Concluídos</button>
    </div>
  </header>

  <!-- Container Principal -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Modal para Adicionar Playlist -->
    <div id="modal-add" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 w-full max-w-sm space-y-4 shadow-2xl">
        <h2 class="text-base font-bold text-zinc-100">Adicionar Nova Playlist</h2>
        <p class="text-xs text-zinc-400">Cole o link completo da playlist ou canal do YouTube:</p>
        <input type="text" id="input-playlist-url" placeholder="https://www.youtube.com/playlist?list=..." class="w-full px-3 py-2 text-xs bg-zinc-950 border border-zinc-800 rounded-lg text-zinc-100 focus:outline-none focus:border-emerald-500">
        <div class="flex gap-2 justify-end">
          <button id="btn-cancel-modal" class="px-3 py-1.5 text-xs bg-zinc-800 text-zinc-300 rounded-lg">Cancelar</button>
          <button id="btn-save-playlist" class="px-3 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-semibold">Adicionar</button>
        </div>
      </div>
    </div>

    <!-- Tela 1: Lista de Playlists Cadastradas (Home) -->
    <section id="view-playlists" class="space-y-3">
      <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Suas Coleções</h2>
      <div id="playlist-cards" class="space-y-3">
        <!-- Cards de playlists carregados dinamicamente -->
      </div>
    </section>

    <!-- Tela 2: Feed de Episódios da Playlist Selecionada -->
    <section id="view-episodes" class="hidden space-y-3">
      <div class="flex items-center justify-between py-1">
        <button id="btn-back" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium flex items-center gap-1">
          ← Voltar para coleções
        </button>
        <span id="playlist-title-header" class="text-xs font-bold text-zinc-300 truncate max-w-[180px]"></span>
      </div>

      <div id="stats" class="text-xs text-zinc-400 text-center py-1 bg-zinc-900/50 rounded-lg border border-zinc-800">
        Carregando episódios...
      </div>

      <div id="feed" class="space-y-3">
        <!-- Cards de episódios renderizados dinamicamente -->
      </div>
    </section>

  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW erro:', err));
    }
  </script>
</body>
</html>
